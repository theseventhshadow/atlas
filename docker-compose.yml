services:
  atlas-postgres-et:
    image: postgres:15-alpine
    container_name: atlas-postgres-et
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${PORT_POSTGRES:-15433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BACKEND/sql/dump-atlas.sql:/tmp/dump-atlas.sql:ro
      - ./BACKEND/sql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atlas-network
    restart: unless-stopped

  atlas-backend-et:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: atlas-backend-et
    hostname: atlas-api
    environment:
      - PORT=4000
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@atlas-postgres-et:5432/${POSTGRES_DB:-atlas}
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - FRONTEND_URL=http://localhost:${PORT_FRONTEND:-3351}
    ports:
      - "${PORT_BACKEND:-4451}:4000"
    depends_on:
      atlas-postgres-et:
        condition: service_healthy
    volumes:
      - ./BACKEND/uploads:/app/uploads
    networks:
      - atlas-network
    restart: unless-stopped

  atlas-frontend-et:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:${PORT_BACKEND:-4451}"
    container_name: atlas-frontend-et
    hostname: atlas-web
    ports:
      - "${PORT_FRONTEND:-3351}:80"
    depends_on:
      - atlas-backend-et
    networks:
      - atlas-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  atlas-network:
    driver: bridge
    name: atlas-network

